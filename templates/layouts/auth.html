{% extends "base.html" %}{% load ui %}

    <span class="flex size-8 items-center justify-center rounded-lg bg-brand-600 text-white">{% icon "bot" class="size-5" %}</span>
    {{ APP_NAME }}

  <div class="card w-full max-w-md">

  </div>
  {% block below %}{% endblock %}

{% endblock %}
