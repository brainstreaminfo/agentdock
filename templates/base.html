{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  {# Apply saved theme before paint to avoid a flash of the wrong theme. #}
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
      var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'vendor/htmx-sse.js' %}"></script>
  <script defer src="{% static 'js/app.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  {% block head %}{% endblock %}
</head>
{# hx-headers sends the CSRF token with every HTMX request. #}
<body class="h-full" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
