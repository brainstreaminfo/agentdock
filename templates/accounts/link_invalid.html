{% extends "layouts/auth.html" %}
{% block title %}Link expired · {{ APP_NAME }}{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold">This link has expired</h1>
<p class="text-sm text-zinc-500 dark:text-zinc-400">Login links work once and only for 15 minutes. Request a new one.</p>
<a href="{% url 'accounts:login' %}" class="btn btn-primary w-full">Get a new link</a>
{% endblock %}
