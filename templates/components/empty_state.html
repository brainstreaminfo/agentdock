{% load ui %}{# Usage: {% include "components/empty_state.html" with icon="inbox" title="…" text="…" %} #}
<div class="flex flex-col items-center justify-center px-6 py-10 text-center">
  <span class="mb-3 flex size-10 items-center justify-center rounded-full bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400">{% icon icon|default:"inbox" class="size-5" %}</span>
  <p class="text-sm font-medium">{{ title }}</p>
  {% if text %}<p class="mt-1 max-w-sm text-sm text-zinc-500 dark:text-zinc-400">{{ text }}</p>{% endif %}
</div>
