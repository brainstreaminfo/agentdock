# Tools: discounts.list, discounts.create_code, discounts.deactivate

fragment DiscountFields on Discount {
  __typename
  ... on DiscountCodeBasic {
    title
    status
    summary
    startsAt
    endsAt
    asyncUsageCount
    codes(first: 5) {
      nodes {
        code
      }
    }
  }
  ... on DiscountCodeBxgy {
    title
    status
    summary
    startsAt
    endsAt
    asyncUsageCount
    codes(first: 5) {
      nodes {
        code
      }
    }
  }
  ... on DiscountCodeFreeShipping {
    title
    status
    summary
    startsAt
    endsAt
    asyncUsageCount
    codes(first: 5) {
      nodes {
        code
      }
    }
  }
  ... on DiscountCodeApp {
    title
    status
    startsAt
    endsAt
    asyncUsageCount
  }
  ... on DiscountAutomaticBasic {
    title
    status
    summary
    startsAt
    endsAt
  }
  ... on DiscountAutomaticBxgy {
    title
    status
    summary
    startsAt
    endsAt
  }
  ... on DiscountAutomaticFreeShipping {
    title
    status
    summary
    startsAt
    endsAt
  }
  ... on DiscountAutomaticApp {
    title
    status
    startsAt
    endsAt
  }
}

query ListDiscounts($first: Int!, $after: String, $query: String) {
  discountNodes(first: $first, after: $after, query: $query, sortKey: CREATED_AT, reverse: true) {
    nodes {
      id
      discount {
        ...DiscountFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetCodeDiscount($id: ID!) {
  codeDiscountNode(id: $id) {
    id
    codeDiscount {
      __typename
      ... on DiscountCodeBasic {
        title
        status
      }
      ... on DiscountCodeBxgy {
        title
        status
      }
      ... on DiscountCodeFreeShipping {
        title
        status
      }
      ... on DiscountCodeApp {
        title
        status
      }
    }
  }
}

mutation CreateBasicCode($basicCodeDiscount: DiscountCodeBasicInput!) {
  discountCodeBasicCreate(basicCodeDiscount: $basicCodeDiscount) {
    codeDiscountNode {
      id
      codeDiscount {
        ... on DiscountCodeBasic {
          title
          status
          summary
          startsAt
          endsAt
        }
      }
    }
    userErrors {
      field
      message
    }
  }
}

mutation DeactivateCode($id: ID!) {
  discountCodeDeactivate(id: $id) {
    codeDiscountNode {
      id
    }
    userErrors {
      field
      message
    }
  }
}

mutation ActivateCode($id: ID!) {
  discountCodeActivate(id: $id) {
    codeDiscountNode {
      id
    }
    userErrors {
      field
      message
    }
  }
}

mutation DeleteCode($id: ID!) {
  discountCodeDelete(id: $id) {
    deletedCodeDiscountId
    userErrors {
      field
      message
    }
  }
}
