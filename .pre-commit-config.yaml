repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-embedded
        name: no Polaris / App Bridge
        entry: ./scripts/check_no_embedded.sh
        language: system
        pass_filenames: false
